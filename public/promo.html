    if (!soundOn && audio) audio.pause(); else if (playing) play();
  };
  $("lang").onclick = function () { lang = { ro: "en", en: "hu", hu: "ro" }[lang]; try { localStorage.setItem("g2p_lang", lang); } catch (e) {} draw(cur); ui(); };
  $("ar").onclick = function () { ar = ar === "9x16" ? "16x9" : "9x16"; setSize(); draw(cur); ui(); };
  $("fs").onclick = function () { var st = $("stage"); (st.requestFullscreen ? st.requestFullscreen() : Promise.reject()).catch(function () {}); };
  addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "k") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") seek(cur + 1); else if (e.key === "ArrowLeft") seek(cur - 1);
  });
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { setSize(); draw(cur); }, 150); });
  if (!REDUCED && qs.get("autoplay") !== "0") play();
}

/* Fonts (incl. latin-ext for ș ț ă ő ű) and the QR load before the first frame. */
var GLYPHS = "ȘȚĂÎÂșțăîâŐŰőűÁÉÍÓÖÚÜáéíóöúü→●↵‹›";
Promise.all([
  document.fonts.load("800 100px 'Barlow Condensed'", GLYPHS), document.fonts.load("700 100px 'Space Mono'", GLYPHS),
  document.fonts.load("400 100px 'Space Mono'", GLYPHS), document.fonts.load("600 100px 'Libre Franklin'", GLYPHS),
  document.fonts.load("500 100px 'Libre Franklin'", GLYPHS),
  new Promise(function (res) { var im = new Image(); im.onload = function () { qrImg = im; res(); }; im.onerror = res; im.src = "/icons/qr-tgm.svg"; })
]).catch(function () {}).then(boot);
