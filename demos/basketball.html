<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Basketball</title>
<style>
  :root { --bg: #f4f1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1A2E; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; }
  .ball { width: min(80vw, 420px); height: auto; display: block; }
</style>
</head>
<body>
<!--
  Classic 8-panel basketball, front view (the point where the two great-circle seams cross faces you).
  Geometry: vertical + horizontal seams through the centre; the two curved seams cross the horizontal
  one at 28% of the radius and swing out to the rim at ~43deg, like a real ball photographed head-on.
  Layers (bottom -> top): drop shadow, orange leather, pebble grain, seams (shadow / groove / lit lip),
  brand text, light & shadow shading, rim darkening. Everything is clipped to the sphere.
-->
<svg class="ball" viewBox="0 0 500 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Basketball">
  <defs>
    <clipPath id="sphere"><circle cx="250" cy="250" r="200"/></clipPath>

    <!-- base leather: amber centre, deeper orange at the rim -->
    <radialGradient id="leather" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#EE6A2C"/>
      <stop offset="0.55" stop-color="#E25822"/>
      <stop offset="1" stop-color="#C63D14"/>
    </radialGradient>

    <!-- pebble grain: staggered pits, each with a dark lower-right and a light upper-left -->
    <pattern id="pebbles" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.6" r="1.25" fill="#7a2a0c" fill-opacity=".38"/>
      <circle cx="1.4" cy="1.2" r=".55" fill="#ffd2b0" fill-opacity=".22"/>
      <circle cx="5.3" cy="4.6" r="1.25" fill="#7a2a0c" fill-opacity=".38"/>
      <circle cx="4.9" cy="4.2" r=".55" fill="#ffd2b0" fill-opacity=".22"/>
    </pattern>
    <!-- irregularity so the grain does not look printed -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.16  0 0 0 0 0.05  0 0 0 -1.1 0.75"/>
    </filter>

    <!-- light from the upper left, core shadow lower right -->
    <radialGradient id="highlight" cx="34%" cy="28%" r="38%">
      <stop offset="0" stop-color="#fff3e6" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffd9b8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="30%" cy="26%" r="95%">
      <stop offset=".45" stop-color="#2a0c02" stop-opacity="0"/>
      <stop offset=".8" stop-color="#2a0c02" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1a0601" stop-opacity=".62"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset=".82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>

    <filter id="lip"><feGaussianBlur stdDeviation=".5"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="drop" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- seam geometry, reused for every seam layer -->
    <g id="seams" fill="none" stroke-linecap="round">
      <path d="M250 40 V460"/>
      <path d="M40 250 H460"/>
      <path d="M104 114 C224 170 224 330 104 386"/>
      <path d="M396 114 C276 170 276 330 396 386"/>
    </g>

    <path id="brandArc" d="M300 205 Q340 150 352 112" fill="none"/>
  </defs>

  <!-- drop shadow on the floor -->
  <ellipse cx="262" cy="466" rx="160" ry="20" fill="#000" fill-opacity=".28" filter="url(#drop)"/>

  <g clip-path="url(#sphere)">
    <rect x="40" y="40" width="420" height="420" fill="url(#leather)"/>
    <rect x="40" y="40" width="420" height="420" fill="url(#pebbles)"/>
    <rect x="40" y="40" width="420" height="420" filter="url(#grain)" opacity=".55"/>

    <!-- seams pressed into the leather: soft groove shadow, the black rubber rib, a lit lower lip -->
    <use href="#seams" stroke="#2a0c02" stroke-opacity=".45" stroke-width="15" filter="url(#soft)"/>
    <use href="#seams" stroke="#1b1311" stroke-width="8.5"/>
    <use href="#seams" stroke="#ffb27a" stroke-opacity=".32" stroke-width="1.6" transform="translate(3.4 4)" filter="url(#lip)"/>

    <!-- subtle brand on the upper-right panel -->
    <text font-family="'Space Mono', ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="2"
          fill="#3a1206" fill-opacity=".38">
      <textPath href="#brandArc">G2P · PLAY</textPath>
    </text>

    <!-- shading on top of everything so the seams follow the sphere's light -->
    <circle cx="250" cy="250" r="200" fill="url(#core)"/>
    <circle cx="250" cy="250" r="200" fill="url(#highlight)"/>
    <circle cx="250" cy="250" r="200" fill="url(#rim)"/>
  </g>
</svg>
</body>
</html>
