firebase.initializeApp({
  databaseURL: "https://fromgreytoplay-default-rtdb.firebaseio.com"
});
const db = firebase.database();
const {
  useState,
  useEffect,
  useRef,
  createContext,
  useContext,
  useCallback
} = React;
const AppCtx = createContext();
const useApp = () => useContext(AppCtx);
const SITE = "https://fromgraytoplay.netlify.app";
function useFirebase(path) {
  const [data, setData] = useState(null);
  useEffect(() => {
    if (!path) return;
    const ref = db.ref(path);
    const fn = snap => setData(snap.val());
    ref.on('value', fn);
    return () => ref.off('value', fn);
  }, [path]);
  return data;
}

/* === Court weather helper (#12 from build brief) === */
/* Maps the existing 1-5 condition score to a weather chip. */
function getCourtWeather(condition, t) {
  const c = Math.max(0, Math.min(5, Number(condition) || 0)) / 5;
  if (c >= 0.8) return { icon: "☀️", key: "weatherExcellent", color: "#10B981", label: t.weatherExcellent };
  if (c >= 0.6) return { icon: "🌤️", key: "weatherGood", color: "#22C55E", label: t.weatherGood };
  if (c >= 0.4) return { icon: "⛅", key: "weatherOkay", color: "#F59E0B", label: t.weatherOkay };
  if (c >= 0.2) return { icon: "🌧️", key: "weatherPoor", color: "#F97316", label: t.weatherPoor };
  return { icon: "⛈️", key: "weatherBroken", color: "#DC2626", label: t.weatherBroken };
}

/* === Anonymize a name to "Andrei P." for the activity feed. === */
function anonName(s) {
  const x = String(s || "").trim();
  if (!x) return "Anonim";
  const parts = x.split(/\s+/);
  return parts.length === 1 ? parts[0] : parts[0] + " " + parts[parts.length - 1][0] + ".";
}

/* === Push an activity entry. Fire-and-forget. === */
function logActivity(type, userName, courtId) {
  try {
    db.ref("activity").push({
      type, userName: anonName(userName), courtId: courtId || null, timestamp: Date.now()
    });
  } catch (e) { /* offline — silently drop */ }
}
// Downscale + JPEG-compress a File so it fits in RTDB as a data URL (~80-150KB).
// Storage bucket isn't configured (config has only databaseURL), so photos live
// in the gallery/ node for now; migrating to Firebase Storage is the future step.
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const cv = document.createElement("canvas");
        cv.width = width; cv.height = height;
        cv.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

var ESSAY = {
  ro: "Cauta Targu Mures pe Google si fotografiile iti vand un vis – trasee de alergare pe Platoul Cornesti, parcuri verzi, fatade colorate. Oras sportiv, zic ei. Dar ia autobuzul spre Tudor sau in spatele Auchan, si visul se crapa, la propriu. Terenurile sunt sparte, cosurile indoite, si nimanui pare sa-i pese. Am vrut sa aflu de ce.\n\nAm cautat mai intai dovezi academice. Un studiu din 2023 in Urban Science (publicat de MDPI) compara modul in care orasele europene gestioneaza infrastructura recreationala si argumenteaza ca distributia inegala tinde sa adanceasca decalajele sociale. Este un studiu amplu, transnational – nu se potriveste perfect pentru un singur oras romanesc – dar rationamentul mi-a ramas. Journal of Urban Health restrange focusul: absenta terenurilor sportive la nivel de cartier se coreleaza direct cu inactivitatea si izolarea tinerilor. Ceea ce a fost decisiv a fost descoperirea Strategiei Integrate de Dezvoltare Urbana (SIDU), publicata pe site-ul Primariei. Documentul admite deschis ca districtele periferice – cele cu populatiile cele mai tinere – primesc cele mai putine investitii in infrastructura.\n\nReportajele locale au adaugat culoare. O investigatie Punctul.ro din octombrie 2025 a expus cum o eroare administrativa de cinci milioane de lei a inghetat renovarea unei baze sportive de pe strada Insulei – birocratie la superlativ. Un alt reportaj Punctul.ro a explorat cum Cluj si Sibiu au transformat cu succes loturi urbane neglijate in hub-uri digitale, evidentiind prin contrast cat de putin a facut Targu Mures. Acum, presa poate sensationaliza, asa ca am verificat cu bugetul oficial al Primariei Targu Mures. Cifrele s-au aliniat: fondurile promise pentru renovari depasesc constant ceea ce se cheltuieste efectiv.\n\nTotusi, cercetarea de birou iti arata doar o parte din imagine. Pe parcursul a doua weekenduri, am strabatut Tudor, zona Auchan si terenurile de langa Sportcomplex, fotografiind asfalt crapat si cosuri indoite si le-am inregistrat pe Google My Maps. Am facut si un sondaj informal rapid – cincisprezece rezidenti, o intrebare: folosesti terenul cel mai aproape de tine? Doisprezece au spus nu, prea degradat. Trei au spus ocazional, din lipsa de alternative. Cincisprezece respondenti nu vor castiga un premiu de statistica, dar acel nivel de consens este greu de respins.\n\nPunand piesele cap la cap, apare un lant clar: pasul unu, municipalitatea concentreaza cheltuielile pe locatii centrale de profil inalt; pasul doi, terenurile periferice se degradeaza din pura neatentie; pasul trei, tinerii din acele zone isi pierd sansa la sport regulat si la viata sociala care vine cu el. Platoul Cornesti ar putea fi intr-un alt cod postal fata de periferie. Nu spun ca cineva actioneaza din rautate – bugetele limitate si prea multe cereri concurente probabil explica mult. Dar rezidentii din aceste cartiere nu au canale civice clare pentru a semnala problema, si aceasta tacere lasa ciclul sa se repete.\n\nPrima mea propunere este un pilot Flip-the-Court: alegem trei dintre cele mai degradate terenuri, le refacem suprafata si echipam fiecare cu un dulap de echipament rezistent la intemperii pe care localnicii il pot debloca printr-o aplicatie gratuita. Aplicatia functioneaza si ca instrument de feedback – oamenii evalueaza facilitatile, raporteaza daunele si sugereaza ce echipament sportiv sa fie aprovizionat. Ca finantare, micro-granturile EU pentru sport-tineret acopera costurile principale; cateva parteneriate cu sali de sport locale acopera intretinerea. De la obtinerea grantului pana la taierea panglicii, sase luni par realizabile.\n\nA doua idee se bazeaza mai mult pe arta decat pe tehnologie. O initiativa Street Canvas ar aduce artistii locali de graffiti si rezidentii impreuna pentru a picta murale colorate la scara mare pe suprafetele renovate – finantata aproape in intregime din spray paint donat si ore de voluntariat. De ce sa ne obosim? Cercetarile privind atasamentul de loc arata ca oamenii care ajuta fizic la modelarea unui spatiu public il trateaza ca pe al lor, iar ratele de vandalism scad corespunzator. O placa cenusie devine un loc de intalnire pe care oamenii chiar vor sa-l protejeze.\n\nNimic din toate acestea nu este cu adevarat despre baschet sau handbal. Este despre daca adresa ta ar trebui sa-ti limiteze oportunitatile. Un pilot mic, cateva murale, un efort comunitar incapatanat – pretul este modest. Singurul lucru scump este sa continuam sa nu facem nimic.",
  en: "Google Târgu Mureș and the photos sell you a dream – running trails on the Cornești Plateau, green parks, colourful facades. Sporty city, they say. But ride the bus out to Tudor or behind Auchan, and the dream cracks, quite literally. The courts are broken, the hoops bent, and nobody seems to care. I wanted to find out why.\n\nI went looking for academic backing first. A 2023 study in Urban Science (published by MDPI) compares how European cities manage recreational infrastructure and argues that uneven distribution tends to widen social gaps rather than narrow them. It is a broad, cross-national piece – not a perfect fit for one Romanian city – but the reasoning stuck with me. The Journal of Urban Health narrows the focus: the absence of neighbourhood-level sports courts correlates directly with youth inactivity and isolation. What really sealed it, though, was finding our city’s Integrated Urban Development Strategy (SIDU), published on the Primaria website. The document openly admits that peripheral districts – the ones with the youngest populations – receive the least infrastructure investment.\n\nLocal reporting added colour. A Punctul.ro investigation from October 2025 exposed how a five-million-lei administrative mix-up froze the renovation of a sports facility on Insulei Street – bureaucracy at its finest. A separate Punctul.ro feature explored how Cluj and Sibiu successfully repurposed neglected urban lots into digital hubs, highlighting by contrast just how little Targu Mures has done. Now, media outlets can sensationalise, so I cross-checked against the official Primaria Targu Mures budget. The numbers lined up: pledged renovation funds consistently outstrip what actually gets spent on the ground.\n\nStill, desk research only shows you part of the picture. Over two weekends, I walked through Tudor, the Auchan area, and the courts near Sportcomplex, photographing cracked asphalt and bent rims and logging it all on Google My Maps. I also ran a quick, informal poll – fifteen residents, one question: do you use the court nearest to you? Twelve said no, too run-down. Three said occasionally, for lack of alternatives. Fifteen respondents will not win a statistics prize, but that level of agreement is hard to dismiss.\n\nPut the pieces together, and a clear chain emerges: step one, the municipality concentrates spending on high-profile central venues; step two, peripheral courts decay from sheer inattention; step three, young people in those areas lose their shot at regular sport and the social life that goes with it. The Cornesti Plateau might as well be in a different postcode from the outskirts. Now, I am not saying anyone is acting out of spite – limited budgets and too many competing demands probably explain a lot. But residents in these neighbourhoods also lack clear civic channels to flag the problem, and that silence lets the cycle repeat itself.\n\nMy first proposal is a Flip-the-Court pilot: choose three of the worst-off courts, resurface them, and fit each with a weather-proof equipment cabinet that locals can unlock through a free phone app. The app doubles as a feedback tool – people rate the facilities, report damage, and suggest what sports gear to stock next. Funding-wise, EU youth-sport micro-grants cover the hard costs; a handful of local gym partnerships cover maintenance. From securing the grant to cutting the ribbon, six months feels achievable.\n\nMy second idea leans more on art than on tech. A Street Canvas initiative would bring local graffiti artists and residents together to paint large-scale, colourful ground murals across the refurbished surfaces – funded almost entirely by donated spray paint and volunteer hours. Why bother? Research on place attachment shows that people who physically help shape a public space treat it as their own, and that damage rates drop accordingly. A once-grey slab becomes a gathering spot people actually want to protect.\n\nNone of this is really about basketball or handball. It is about whether your address should cap your opportunities. A small pilot, a few murals, some stubborn community effort – the price tag is modest. The only expensive thing is continuing to do nothing."
