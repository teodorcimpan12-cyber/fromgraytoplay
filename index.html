<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#1A1A2E;--darkCard:#16213E;--green:#10B981;--coral:#F97316;--teal:#0D9488;--grey:#6B7280;--darkGrey:#374151;--light:#F8FAFC;--lightGrey:#D1D5DB;--white:#FFFFFF;--red:#DC2626;--bg:var(--light);--bgCard:var(--white);--text:var(--darkGrey);--textSec:var(--grey);--border:var(--lightGrey);--navBg:var(--white);--shadow:0 2px 12px rgba(0,0,0,.08);--radius:12px}

html{scroll-behavior:smooth}
body{font-family:'Libre Franklin',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green)}
.container{max-width:1100px;margin:0 auto;padding:0 1rem}
.navbar{position:sticky;top:0;z-index:100;background:var(--navBg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;max-width:1100px;margin:0 auto}
.nav-logo{display:flex;align-items:center;gap:.5rem;font-family:'Space Mono',monospace;font-weight:700;font-size:1rem;color:var(--green)}
.nav-logo .bar{width:4px;height:22px;background:var(--green);border-radius:2px}
.nav-links{display:flex;gap:.15rem;align-items:center}
.nav-links a,.nav-links button{padding:.35rem .6rem;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--text);background:none;border:none;white-space:nowrap;transition:background .15s}

.hamburger{display:none;background:none;border:none;color:var(--text);font-size:1.5rem;padding:.3rem}

.mobile-menu{position:fixed;inset:0;z-index:200;background:var(--bg);padding:3.5rem 1rem 1rem;overflow-y:auto;animation:slideR .2s}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:8px;font-weight:600;font-size:.88rem;border:none;transition:background .2s,transform .15s,box-shadow .2s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#0ea472;box-shadow:0 6px 20px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-coral{background:var(--coral);color:#fff}.btn-coral:hover{background:#e8680d;box-shadow:0 6px 20px rgba(249,115,22,.35);transform:translateY(-1px)}

.card{background:var(--bgCard);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem;transition:transform .2s,box-shadow .2s,border-color .2s;border-left:4px solid transparent;overflow:hidden}

.badge-green{background:rgba(16,185,129,.15);color:var(--green)}.badge-coral{background:rgba(249,115,22,.15);color:var(--coral)}.badge-red{background:rgba(220,38,38,.15);color:var(--red)}.badge-teal{background:rgba(13,148,136,.15);color:var(--teal)}

.grid{display:grid;gap:1rem}.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.map-box{border-radius:var(--radius);overflow:hidden;height:380px;border:2px solid var(--border)}

.footer{background:var(--dark);color:#9CA3AF;padding:1.5rem 0;text-align:center;font-size:.82rem}
.footer a{color:var(--green)}.footer .owner{font-family:'Space Mono',monospace;color:var(--green);font-weight:700;font-size:1rem}
.onboarding{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:2rem}
.onboarding h1{font-size:2rem;margin-bottom:.8rem}.onboarding p{font-size:1.05rem;color:#9CA3AF;max-width:380px;margin-bottom:1.5rem}
.ob-dots{display:flex;gap:.5rem;margin-bottom:1.2rem}.ob-dots span{width:10px;height:10px;border-radius:50%;background:#374151;transition:background .2s}.ob-dots span.active{background:var(--green)}
.petition-option{background:var(--bgCard);border-radius:var(--radius);padding:1.1rem;cursor:pointer;border:3px solid var(--border);transition:all .2s;text-align:center;user-select:none}
.petition-option:active{transform:scale(.98)}
.petition-option.sel-flip{border-color:#10B981;background:rgba(16,185,129,.06);box-shadow:0 0 0 1px #10B981}
.petition-option.sel-mural{border-color:#F97316;background:rgba(249,115,22,.06);box-shadow:0 0 0 1px #F97316}
.petition-option.sel-both{border-color:#0D9488;background:rgba(13,148,136,.06);box-shadow:0 0 0 1px #0D9488}
.po-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);margin:0 auto .5rem;transition:all .15s;display:flex;align-items:center;justify-content:center}
.sel-flip .po-radio{border-color:#10B981;background:#10B981}.sel-mural .po-radio{border-color:#F97316;background:#F97316}.sel-both .po-radio{border-color:#0D9488;background:#0D9488}
.po-radio-dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .1s}
.sel-flip .po-radio-dot,.sel-mural .po-radio-dot,.sel-both .po-radio-dot{opacity:1}
.po-emoji{font-size:2.2rem;margin-bottom:.3rem}.po-label{font-family:'Space Mono',monospace;font-weight:700;font-size:.9rem}.po-desc{font-size:.78rem;color:var(--textSec);margin-top:.2rem}
.vol-check{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--bgCard);border:2px solid var(--border);border-radius:10px;cursor:pointer;user-select:none}
.vol-check.on{border-color:var(--green);background:rgba(16,185,129,.05)}
.vol-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:.7rem;color:#fff}
.vol-check.on .vol-box{background:var(--green);border-color:var(--green)}
.pet-submit{width:100%;padding:.8rem;border:none;border-radius:10px;font-family:'Space Mono',monospace;font-weight:700;font-size:1rem;transition:all .2s}
.pet-submit:enabled{background:var(--green);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(16,185,129,.3)}
.pet-submit:enabled:hover{transform:translateY(-1px)}.pet-submit:enabled:active{transform:scale(.98)}
.pet-submit:disabled{background:var(--border);color:var(--textSec);cursor:not-allowed}
.install-banner{background:linear-gradient(135deg,#0D9488,#10B981);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;justify-content:center;gap:.7rem;font-size:.85rem;position:relative;z-index:90;flex-wrap:wrap;animation:slideDown .3s}
.install-banner button.ib-btn{background:#fff;color:#0D9488;border:none;padding:.35rem .9rem;border-radius:6px;font-weight:700;font-size:.8rem;cursor:pointer}
.install-banner .ib-x{background:none;border:none;color:rgba(255,255,255,.7);font-size:1.1rem;cursor:pointer;position:absolute;right:.5rem}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fabGlow{0%,100%{box-shadow:0 6px 24px rgba(16,185,129,.4)}60%{box-shadow:0 8px 36px rgba(16,185,129,.7)}}
@keyframes livePing{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
.animate-in{animation:slideUp .4s ease both}
.fab{animation:fabGlow 2.4s ease-in-out infinite}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);position:relative;flex-shrink:0}
.live-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--green);animation:livePing 1.4s ease-out infinite}
.barlow{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-.3px}
@media(prefers-reduced-motion:reduce){.fab,.live-dot::after{animation:none}}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-1{gap:.5rem}.gap-2{gap:1rem}
.text-sm{font-size:.85rem}.text-xs{font-size:.75rem}.font-bold{font-weight:700}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.5rem}.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}
.text-green{color:var(--green)}.text-red{color:var(--red)}
/* FAB */
.fab{position:fixed;bottom:1.5rem;right:1.2rem;z-index:150;background:var(--green);color:#fff;border:none;border-radius:28px;padding:.75rem 1.3rem;font-family:'Space Mono',monospace;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:.4rem;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:48px}
.fab:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(16,185,129,.6);animation:none}
.fab:active{transform:scale(.95)}
/* Report status */
.badge-received{background:rgba(100,116,139,.15);color:#64748B}
.badge-analyzing{background:rgba(249,115,22,.15);color:var(--coral)}
.badge-planned{background:rgba(13,148,136,.15);color:var(--teal)}
.badge-resolved{background:rgba(16,185,129,.15);color:var(--green)}
/* Report timeline */
.report-timeline{display:flex;align-items:flex-start;gap:0;margin:.6rem 0}
.rt-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.rt-step::after{content:'';position:absolute;top:10px;left:calc(50% + 11px);right:calc(-50% + 11px);height:2px;background:var(--border);z-index:0}
.rt-step:last-child::after{display:none}
.rt-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--bgCard);z-index:1;display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0}
.rt-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.rt-dot.active{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.rt-label{font-size:.58rem;color:var(--textSec);margin-top:.2rem;text-align:center;line-height:1.2;max-width:52px}
/* Report category picker */
.rcat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem;margin:.5rem 0}
.rcat-btn{padding:.55rem .5rem;border-radius:8px;border:2px solid var(--border);background:var(--bgCard);cursor:pointer;text-align:center;transition:all .15s;font-size:.78rem;font-weight:600;color:var(--text)}
.rcat-btn:hover,.rcat-btn.sel{border-color:var(--green);background:rgba(16,185,129,.08);color:var(--green)}
/* Official badge */
.badge-official{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.leaflet-container{font-family:inherit;z-index:1}
/* Admin */
.admin-shell{min-height:100vh;background:#0B0E18;color:#E5E7EB}
.admin-hdr{background:#10131F;border-bottom:1px solid #1E2235;padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.admin-hdr h1{font-family:'Space Mono',monospace;font-size:1rem;color:#10B981}
.admin-body{display:flex;min-height:calc(100vh - 50px)}

@media(max-width:700px){.admin-side{display:none}}

/* ===== 3D hero (scoped .h3d-*) ===== */
.h3d-hero{position:relative;width:100%;height:72vh;min-height:460px;max-height:760px;overflow:hidden;background:linear-gradient(180deg,#39414c,#262b33 50%,#161a20);color:#fff;font-family:'Libre Franklin',sans-serif}
.h3d-canvas{position:absolute;inset:0;z-index:0}
.h3d-canvas canvas{display:block;touch-action:none}
.h3d-scrim{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(13,16,21,0),rgba(13,16,21,.5) 46%,rgba(13,16,21,.92))}
.h3d-scrim-top{position:absolute;left:0;right:0;top:0;height:20%;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(13,16,21,.55),rgba(13,16,21,0))}
.h3d-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1.4rem 1.2rem 1.5rem;z-index:3;pointer-events:none}
.h3d-kicker{font-family:'Space Mono',monospace;color:#10B981;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:.4rem}
.h3d-title{font-family:'Barlow Condensed','Space Mono',monospace;font-weight:800;font-size:clamp(2.2rem,9vw,4rem);line-height:1.0;margin:0 0 .5rem;text-shadow:0 6px 30px rgba(0,0,0,.6);color:#fff;letter-spacing:-.5px}
.h3d-title .g{color:#9CA3AF}
.h3d-title .p{background:linear-gradient(90deg,#10B981,#0D9488,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.h3d-sub{color:#C7CBD1;max-width:30rem;margin-bottom:1rem;font-size:.95rem;line-height:1.5}
.h3d-cta{display:flex;gap:.6rem;flex-wrap:wrap;pointer-events:auto}
.h3d-btn{font-family:'Space Mono',monospace;font-weight:700;border:none;border-radius:10px;padding:.7rem 1.15rem;font-size:.88rem;cursor:pointer;transition:transform .1s}
.h3d-btn:active{transform:scale(.97)}
.h3d-btn-green{background:#10B981;color:#06281d;box-shadow:0 8px 30px rgba(16,185,129,.35)}
.h3d-btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.h3d-hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:.72rem;color:rgba(255,255,255,.5);font-family:'Space Mono',monospace;pointer-events:none;z-index:3;transition:opacity .5s;text-align:center}
.h3d-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#fff,#fff 58%,rgba(255,255,255,.7));opacity:0;pointer-events:none;z-index:5}
.h3d-modal{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;padding:1rem;background:rgba(8,10,14,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.h3d-sheet{position:relative;width:100%;max-width:30rem;background:var(--bgCard);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.2rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.h3d-x{position:absolute;top:.6rem;right:.65rem;background:rgba(127,127,127,.18);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:.85rem;cursor:pointer}
.h3d-ic{font-size:2.3rem;line-height:1;margin-bottom:.4rem}
.h3d-tag{font-family:'Space Mono',monospace;font-size:.64rem;letter-spacing:2px;color:#10B981;text-transform:uppercase;margin-bottom:.3rem}
.h3d-mtitle{font-family:'Space Mono',monospace;font-size:1.3rem;line-height:1.1;margin-bottom:.55rem}
.h3d-mbody{color:var(--textSec);font-size:.92rem;line-height:1.55;margin-bottom:1rem}
.h3d-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C7CBD1;font-size:.85rem;font-family:'Space Mono',monospace;z-index:4;pointer-events:none}

/* ============================================================
   POLISH LAYER — glassmorphism, scroll reveal, skeleton, radar,
   premium hero, refined cards. Keeps brand tokens (green/coral/teal).
   ============================================================ */
/* Refined card depth + smooth lift */
.card{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1),border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.14)}
[data-theme="dark"] .card:hover{box-shadow:0 14px 40px rgba(0,0,0,.5)}
/* Glassmorphism surface */
.glass{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 32px rgba(0,0,0,.1)}
[data-theme="dark"] .glass{background:rgba(22,33,62,.6);border:1px solid rgba(255,255,255,.08)}
/* Gradient text utility */
.grad-text{background:linear-gradient(100deg,var(--green),var(--teal) 55%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
/* Scroll reveal — base hidden, .in reveals. Stagger via --d */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1);transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
/* Skeleton shimmer */
.skeleton{position:relative;overflow:hidden;background:var(--border);border-radius:8px}
.skeleton::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.4s infinite}
[data-theme="dark"] .skeleton::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
@keyframes shimmer{100%{transform:translateX(100%)}}
/* Premium stat tiles */
.stat-tile{position:relative;border-radius:16px;padding:1.3rem 1.1rem;overflow:hidden;border:1px solid var(--border);background:var(--bgCard);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
.stat-tile:hover{transform:translateY(-3px)}
.stat-tile .stat-glow{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(40px);opacity:.18;top:-30px;right:-30px}
.stat-tile .stat-number{font-size:2.6rem;line-height:1;position:relative}
/* Premium hero with animated gradient mesh */
.hero-premium{position:relative;overflow:hidden;background:linear-gradient(135deg,#0F1428,#16213E 60%,#0D2A2A);color:#fff;padding:3rem 0 3.2rem}
.hero-mesh{position:absolute;inset:0;z-index:0;opacity:.6;background:
  radial-gradient(circle at 18% 25%,rgba(16,185,129,.32),transparent 42%),
  radial-gradient(circle at 82% 18%,rgba(249,115,22,.22),transparent 40%),
  radial-gradient(circle at 70% 88%,rgba(13,148,136,.30),transparent 45%);
  animation:meshFloat 16s ease-in-out infinite}
@keyframes meshFloat{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-3%,2%,0) scale(1.06)}66%{transform:translate3d(2%,-2%,0) scale(1.03)}}
.hero-grid-lines{position:absolute;inset:0;z-index:0;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:44px 44px}
.hero-title{font-family:'Barlow Condensed','Space Mono',monospace;font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:.98;letter-spacing:-1px;margin-bottom:.6rem}
.hero-pill{display:inline-flex;align-items:center;gap:.45rem;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#10B981;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);padding:.35rem .8rem;border-radius:20px;margin-bottom:1rem}
/* Radar chart (court ratings) */
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.rate-stars{display:inline-flex;gap:.15rem}
.rate-star{cursor:pointer;font-size:1.5rem;line-height:1;color:var(--border);transition:transform .12s,color .15s;background:none;border:none;padding:0}
.rate-star.on{color:var(--coral)}
.rate-star:hover{transform:scale(1.18)}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--border)}
.rate-row:last-child{border-bottom:none}
.rate-label{font-size:.85rem;font-weight:600}
.rate-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;max-width:120px}
.rate-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--coral),var(--green));transition:width .8s cubic-bezier(.22,1,.36,1)}
.rate-num{font-family:'Barlow Condensed',monospace;font-weight:800;font-size:1.1rem;min-width:30px;text-align:right}
/* Section title accent bar */
.section-title{position:relative}
/* Smooth page enter */
.animate-in{animation:pageEnter .55s cubic-bezier(.22,1,.36,1) both}
@keyframes pageEnter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* Dossier button glow */
.btn-dossier{background:linear-gradient(100deg,var(--green),var(--teal));color:#fff;position:relative;overflow:hidden}
.btn-dossier::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sheen 3.5s ease-in-out infinite}
@keyframes sheen{0%,100%{left:-60%}50%{left:120%}}
/* === Milestone progress bar === */
.milestone-bar{position:relative;height:12px;background:var(--border);border-radius:6px;overflow:visible;margin:1rem 0 1.8rem}
.milestone-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width 1s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
.milestone-fill::after{content:'';position:absolute;top:-4px;left:-10%;width:120%;height:10px;background:rgba(255,255,255,.35);border-radius:50%;animation:liquidWave 2.2s ease-in-out infinite}
@keyframes liquidWave{0%,100%{transform:translateX(-5%) scaleY(1)}50%{transform:translateX(8%) scaleY(.6)}}
@media(prefers-reduced-motion:reduce){.milestone-fill::after{animation:none}}
.no-fx .milestone-fill::after{display:none}
.milestone-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--bgCard);z-index:2;cursor:default}
.milestone-marker.ms-reached{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.22)}
.milestone-marker.ms-next{background:var(--border)}
.milestone-label{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-size:.6rem;white-space:nowrap;color:var(--textSec);font-family:'Space Mono',monospace;font-weight:700}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(800deg);opacity:0}}
.confetti-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-dot{position:absolute;animation:confettiFall linear forwards}
@keyframes mileBounce{0%{transform:scale(.5) rotate(-4deg);opacity:0}65%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.milestone-cel{background:linear-gradient(135deg,rgba(16,185,129,.13),rgba(13,148,136,.08));border:2px solid var(--green);border-radius:16px;padding:1.5rem 1.2rem;text-align:center;animation:mileBounce .5s cubic-bezier(.34,1.56,.64,1) both;margin-bottom:1rem}
/* Neighbourhood inequality chart */
.hood-chart-row{display:flex;align-items:center;gap:.65rem;margin-bottom:.8rem}
.hood-chart-label{width:128px;font-size:.8rem;font-weight:600;color:var(--text);flex-shrink:0;line-height:1.2}
.hood-chart-bar-wrap{flex:1;background:var(--border);border-radius:5px;overflow:hidden}
.hood-chart-bar{height:22px;border-radius:5px;transition:width 1.3s cubic-bezier(.22,1,.36,1)}
.hood-chart-val{font-family:'Barlow Condensed',monospace;font-weight:800;font-size:1rem;width:38px;text-align:right;flex-shrink:0}
.hood-gap-callout{background:linear-gradient(130deg,rgba(220,38,38,.07) 0%,rgba(16,185,129,.07) 100%);border:1px solid rgba(220,38,38,.2);border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem}
.share-canvas{width:100%;border-radius:10px;border:1px solid var(--border);display:block}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.hero-mesh,.btn-dossier::after,.skeleton::after{animation:none}.animate-in{animation:none}}
/* === Show-off animation pack === */
.btn,.h3d-btn,.tabs button{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rippleOut .55s ease-out forwards;pointer-events:none}
@keyframes rippleOut{to{transform:scale(3.2);opacity:0}}
.tilt{will-change:transform;transition:transform .18s ease-out,box-shadow .25s}
.tilt:hover{box-shadow:0 18px 44px rgba(0,0,0,.18)}
.lr span{display:inline-block;opacity:0;transform:translateY(.6em) rotate(4deg);animation:lrIn .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--ld,0ms)}
@keyframes lrIn{to{opacity:1;transform:none}}
.h3d-title .p{display:inline-block;background-size:220% 100%;animation:lrIn .6s cubic-bezier(.22,1,.36,1) .55s both,gradShift 5s ease-in-out 1.2s infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.h3d-particles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.h3d-particle{position:absolute;bottom:-14px;border-radius:50%;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-640px) translateX(var(--sway,24px));opacity:0}}
/* Pro-max effect pack */
.card,.stat-tile{position:relative}
.card::after,.stat-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .35s;pointer-events:none;background:radial-gradient(440px circle at var(--mx,50%) var(--my,50%),rgba(16,185,129,.14),transparent 65%)}
.card:hover::after,.stat-tile:hover::after{opacity:1}
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
.glow-border{border:1.5px solid transparent !important;background:linear-gradient(var(--bgCard),var(--bgCard)) padding-box,conic-gradient(from var(--ga),var(--green),var(--teal),var(--coral),var(--green)) border-box !important;animation:gspin 4.5s linear infinite}
@keyframes gspin{to{--ga:360deg}}
.page-wipe{position:fixed;inset:0;z-index:9997;pointer-events:none;background:linear-gradient(105deg,transparent 8%,rgba(16,185,129,.9) 38%,rgba(13,148,136,.94) 50%,rgba(16,185,129,.9) 62%,transparent 92%);transform:translateX(-130%) skewX(-8deg);animation:wipeSweep .55s cubic-bezier(.76,0,.24,1) forwards}
@keyframes wipeSweep{to{transform:translateX(130%) skewX(-8deg)}}
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:auroraMove 14s ease-in-out infinite alternate}
.aurora span:nth-child(1){width:420px;height:420px;background:var(--green);top:-130px;left:-90px}
.aurora span:nth-child(2){width:380px;height:380px;background:var(--teal);bottom:-150px;right:-70px;animation-delay:-5s}
.aurora span:nth-child(3){width:300px;height:300px;background:var(--coral);top:25%;left:58%;opacity:.3;animation-duration:19s;animation-delay:-9s}
@keyframes auroraMove{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,46px) scale(1.18)}}
.shimmer-text{background:linear-gradient(100deg,#fff 38%,var(--green) 48%,#7DF7C9 52%,#fff 62%);background-size:230% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:textShine 4s linear infinite}
@keyframes textShine{to{background-position:-230% 0}}
.ticker-wrap{display:flex;overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bgCard);padding:.6rem 0}
.ticker{display:flex;flex-shrink:0;min-width:100%;gap:2.4rem;white-space:nowrap;padding-right:2.4rem;animation:tickerMove 30s linear infinite}
.ticker-wrap:hover .ticker{animation-play-state:paused}
.ticker-item{font-size:.82rem;color:var(--textSec)}
.ticker-item b{color:var(--text)}
@keyframes tickerMove{to{transform:translateX(-100%)}}
.h3d-btn,.btn-green{will-change:transform}
/* Rule-everything: banner / presence / palette / maintenance / admin controls */
.site-banner{text-align:center;padding:.5rem 1rem;font-size:.85rem;font-weight:600;color:#fff;animation:slideDown .3s}
.sb-info{background:linear-gradient(90deg,var(--teal),var(--green))}
.sb-warn{background:linear-gradient(90deg,var(--coral),#F59E0B)}
.sb-alert{background:linear-gradient(90deg,var(--red),#B91C1C)}
.presence{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--green);font-family:'Space Mono',monospace;padding:.15rem .55rem;border:1px solid rgba(16,185,129,.35);border-radius:20px;margin:0 .2rem}
.presence i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:presencePulse 1.8s infinite}
@keyframes presencePulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.cp-overlay{position:fixed;inset:0;z-index:9000;background:rgba(8,10,22,.55);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 1rem 0;animation:fadeIn .15s}
.cp{width:min(560px,100%);background:var(--bgCard);border:1px solid var(--border);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;animation:cpIn .22s cubic-bezier(.22,1,.36,1)}
@keyframes cpIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
.cp-input{border:none;border-bottom:1px solid var(--border);border-radius:0;padding:.9rem 1rem;font-size:1rem;background:transparent}
.cp-input:focus{border-color:var(--green)}
.cp-list{max-height:46vh;overflow-y:auto;padding:.4rem}
.cp-group{font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--textSec);padding:.55rem .6rem .25rem;font-family:'Space Mono',monospace}
.cp-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .6rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.cp-item.sel{background:rgba(16,185,129,.13);box-shadow:inset 2px 0 0 var(--green)}
.cp-item small{color:var(--textSec)}
.cp-empty{padding:1.4rem;text-align:center;color:var(--textSec)}
.cp-hint{padding:.5rem .9rem;border-top:1px solid var(--border);font-size:.7rem;color:var(--textSec);font-family:'Space Mono',monospace}
.maint{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:var(--dark);color:#fff}
.maint-ic{font-size:3.2rem;margin-bottom:1rem;animation:pulse 2s infinite}
.maint h1{font-size:1.8rem;margin-bottom:.5rem}
.maint p{color:#9CA3AF;max-width:420px}
.a-sec{margin:1.5rem 0 .6rem;font-size:.95rem}
.a-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:#151828;border:1px solid #1E2235;border-radius:10px;padding:.65rem .8rem;margin-bottom:.5rem}
.a-row.a-danger{border-color:#7F1D1D}
.a-toggle{width:46px;height:26px;border-radius:20px;border:1px solid #1E2235;background:#0D101F;position:relative;cursor:pointer;transition:background .2s,border-color .2s;flex-shrink:0}
.a-toggle i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#6B7280;transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s}
.a-toggle.on{background:rgba(16,185,129,.25);border-color:#10B981}
.a-toggle.on i{transform:translateX(20px);background:#10B981}
.a-del{background:none;border:1px solid #7F1D1D;color:#F87171;border-radius:6px;padding:.25rem .55rem;cursor:pointer;flex-shrink:0}
.a-del:hover{background:#7F1D1D;color:#fff}
.a-swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.a-swatch.on{border-color:#fff;box-shadow:0 0 0 2px #10B981}
.featured-card{border-left:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.no-fx *,.no-fx *::before,.no-fx *::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
.no-fx .page-wipe,.no-fx .aurora,.no-fx .h3d-particles,.no-fx .ripple{display:none !important}
.no-fx .card::after,.no-fx .stat-tile::after{display:none}
@media(prefers-reduced-motion:reduce){.lr span{animation:none;opacity:1;transform:none}.h3d-particle{display:none}.h3d-title .p{animation:none}.tilt{transition:none}.ripple{display:none}.page-wipe{display:none}.aurora span{animation:none}.shimmer-text{animation:none;background:none;color:inherit}.ticker{animation:none}.glow-border{animation:none}.card::after,.stat-tile::after{display:none}.presence i{animation:none}.cp,.cp-overlay{animation:none}.maint-ic{animation:none}}
/* === Achievement/Badge System === */
.badge-unlock-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(8,10,22,.8);backdrop-filter:blur(10px);animation:fadeIn .2s}
.badge-unlock-card{background:var(--bgCard);border:2px solid var(--green);border-radius:24px;padding:2.5rem 2.2rem;text-align:center;animation:badgeUnlock .7s cubic-bezier(.34,1.56,.64,1) both;box-shadow:0 30px 80px rgba(16,185,129,.25),0 0 0 1px rgba(16,185,129,.15);max-width:320px;width:calc(100% - 2rem)}
@keyframes badgeUnlock{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}

firebase.initializeApp({
  databaseURL: "https://fromgreytoplay-default-rtdb.firebaseio.com"

const db = firebase.database();
const {
  useState,
  useEffect,
  useRef,
  createContext,
  useContext,
  useCallback
} = React;
const AppCtx = createContext();
const useApp = () => useContext(AppCtx);
const SITE = "https://fromgreytoplay.netlify.app";
function useFirebase(path) {
  const [data, setData] = useState(null);
  useEffect(() => {
    if (!path) return;
    const ref = db.ref(path);
    const fn = snap => setData(snap.val());
    ref.on('value', fn);
    return () => ref.off('value', fn);
  }, [path]);
  return data;
}

/* B3 — follow / unfollow per voterKey */
function useFollows() {
  const vk = getVoterKey ? getVoterKey() : (localStorage.getItem("g2p_vk") || "");
  const raw = useFirebase(vk ? "follows/" + vk : null);
  const follows = raw || {};
  const isFollowing = id => !!follows[id];
  const toggle = id => {
    if (!vk) return;
    if (follows[id]) db.ref("follows/" + vk + "/" + id).remove();
    else db.ref("follows/" + vk + "/" + id).set(true);
  };
  return { follows, isFollowing, toggle };
}

/* Polish: animated count-up for stat numbers */
function useCountUp(target, duration) {
  const [val, setVal] = useState(0);
  const ref = useRef(target);
  ref.current = target;
  useEffect(() => {
    const end = Number(target) || 0;
    if (end === 0) { setVal(0); return; }
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches) { setVal(end); return; }
    let raf, start;
    const dur = duration || 1100;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(eased * end));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

/* Polish: scroll-reveal via IntersectionObserver. Attach ref to any element. */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("in"); return; }
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

/* Show-off: wrapper element with scroll-reveal + stagger delay (--d). */
function Reveal(props) {
  const ref = useReveal();
  const p = { ...props, ref, className: "reveal " + (props.className || ""), style: { ...(props.style || {}), "--d": (props.d || 0) + "ms" } };
  delete p.d; delete p.as;
  return React.createElement(props.as || "div", p);
}

/* Show-off: 3D tilt that follows the cursor. Skipped on touch + reduced motion. */
function useTilt(max) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el || !window.matchMedia) return;
    if (window.matchMedia("(prefers-reduced-motion:reduce)").matches || window.matchMedia("(hover: none)").matches) return;
    const mv = e => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = "perspective(700px) rotateX(" + (-py * (max || 7)).toFixed(2) + "deg) rotateY(" + (px * (max || 7)).toFixed(2) + "deg) translateY(-2px)";
    };
    const lv = () => { el.style.transform = ""; };
    el.addEventListener("mousemove", mv);
    el.addEventListener("mouseleave", lv);
    return () => { el.removeEventListener("mousemove", mv); el.removeEventListener("mouseleave", lv); };
  }, [max]);
  return ref;
}

/* Show-off: div with 3D tilt. Use like a normal div; optional max (deg). */
function TiltDiv(props) {
  const ref = useTilt(props.max);
  const p = { ...props, ref, className: (props.className || "") + " tilt" };
  delete p.max;
  return React.createElement("div", p);
}

/* Show-off: letter-by-letter text reveal. aria keeps the full word readable. */
function LetterReveal({ text, base }) {
  return React.createElement("span", { className: "lr", role: "text", "aria-label": text },

/* === Court weather helper (#12 from build brief) === */
/* Maps the existing 1-5 condition score to a weather chip. */
function getCourtWeather(condition, t) {
  const c = Math.max(0, Math.min(5, Number(condition) || 0)) / 5;
  if (c >= 0.8) return { icon: "☀️", key: "weatherExcellent", color: "#10B981", label: t.weatherExcellent };
  if (c >= 0.6) return { icon: "🌤️", key: "weatherGood", color: "#22C55E", label: t.weatherGood };
  if (c >= 0.4) return { icon: "⛅", key: "weatherOkay", color: "#F59E0B", label: t.weatherOkay };
  if (c >= 0.2) return { icon: "🌧️", key: "weatherPoor", color: "#F97316", label: t.weatherPoor };
  return { icon: "⛈️", key: "weatherBroken", color: "#DC2626", label: t.weatherBroken };
}

/* === Cycle through ro -> en -> hu === */
const LANG_ORDER = ["ro", "en", "hu"];
const LANG_LABEL = { ro: "EN", en: "HU", hu: "RO" };
function nextLang(l) {
  const i = LANG_ORDER.indexOf(l);
  return LANG_ORDER[(i + 1) % LANG_ORDER.length];
}

/* === Anonymize a name to "Andrei P." for the activity feed. === */
function anonName(s) {
  const x = String(s || "").trim();
  if (!x) return "Anonim";
  const parts = x.split(/\s+/);
  return parts.length === 1 ? parts[0] : parts[0] + " " + parts[parts.length - 1][0] + ".";
}

/* === Push an activity entry. Fire-and-forget. === */
function logActivity(type, userName, courtId) {
  try {
    db.ref("activity").push({
      type, userName: anonName(userName), courtId: courtId || null, timestamp: Date.now()
    });
  } catch (e) { /* offline — silently drop */ }
  try { bumpStreak(); } catch (e) { /* streak is best-effort */ }
}
// Downscale + JPEG-compress a File so it fits in RTDB as a data URL (~80-150KB).
// Storage bucket isn't configured (config has only databaseURL), so photos live
// in the gallery/ node for now; migrating to Firebase Storage is the future step.
function shareCourt(court, t, toast) {
  const url = SITE + "/#court-" + court.id;
  const title = "From Grey to Play · " + court.name;
  const text = court.name + " · " + (court.address || "Târgu Mureș");
  if (navigator.share) {
    navigator.share({ title, text, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => toast(t.copiedLink)).catch(() => toast(t.error));
  }
}

/* === Hash routing. "#courts" etc. select a page; "#court-{id}" deep-links
   into CourtsPage (used by shareCourt + manifest shortcuts). "#/admin" is
   handled separately in App. === */
const PAGE_IDS = ["home", "courts", "reports", "petition", "community", "impact", "help", "about", "profile"];
function pageFromHash() {
  const h = location.hash.replace(/^#\/?/, "");
  if (h.indexOf("court-") === 0) return "courts";
  return PAGE_IDS.indexOf(h) >= 0 ? h : "home";
}

/* === Trigger a client-side file download (open data export). === */
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Show-off: theme switch with a circular reveal (View Transitions API).
   Falls back to a plain toggle on unsupported browsers / reduced motion. */
function switchTheme(e, theme, setTheme) {
  const next = theme === "dark" ? "light" : "dark";
  const rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (!document.startViewTransition || rm || !ReactDOM.flushSync) { setTheme(next); return; }
  const x = (e && e.clientX) || window.innerWidth / 2, y = (e && e.clientY) || 40;
  const vt = document.startViewTransition(() => { ReactDOM.flushSync(() => setTheme(next)); });
  vt.ready.then(() => {
    const r = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    document.documentElement.animate(
      { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + r + "px at " + x + "px " + y + "px)"] },
      { duration: 550, easing: "cubic-bezier(.22,1,.36,1)", pseudoElement: "::view-transition-new(root)" }
    );
  }).catch(() => {});
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const cv = document.createElement("canvas");
        cv.width = width; cv.height = height;
        cv.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* === Court Health Score Ring === */
function getCourtHealthScore(court, allReports, ratingsData) {
  var score = 0;
  var cond = court.condition || 0;
  score += (cond / 5) * 40;
  var openReps = allReports ? Object.values(allReports).filter(function(r) { return r.courtId === court.id && r.status !== "resolved"; }).length : (court.reports || 0);
  score -= Math.min(openReps * 6, 24);
  if (ratingsData) {
    var rVals = Object.values(ratingsData);
    if (rVals.length > 0) {
      var avg = rVals.reduce(function(s,r) {
        var dims = [r.surface||0,r.lighting||0,r.equipment||0,r.safety||0];
        return s + dims.reduce(function(a,b){return a+b;},0)/4;
      }, 0) / rVals.length;
      score += (avg / 5) * 30;
    }
  }
  if (court.checkins) {
    var recent = Object.values(court.checkins).filter(function(c) { return Date.now() - (c.timestamp||0) < 7*24*3600*1000; }).length;
    score += Math.min(recent * 2, 10);
  }
  return Math.max(0, Math.min(100, Math.round(score)));
}

function CourtHealthRing(props) {
  var court = props.court;
  var appCtx = useApp();
  var lang = appCtx.lang, t = appCtx.t;
  var allReports = useFirebase("reports");
  var ratingsData = useFirebase("ratings/" + court.id);
  var score = getCourtHealthScore(court, allReports, ratingsData);
  var color = score >= 70 ? "var(--green)" : score >= 40 ? "var(--coral)" : "var(--red)";
  var R = 36, circ = 2 * Math.PI * R;
  var offset = circ - (score / 100) * circ;

  var trendLabel = score >= 70 ? "↑ " + (lang==="ro"?"excelent":lang==="hu"?"kiváló":"excellent")
    : score >= 40 ? "→ " + (lang==="ro"?"mediu":lang==="hu"?"közepes":"average")
    : "↓ " + (lang==="ro"?"critic":lang==="hu"?"kritikus":"critical");
  return React.createElement("div", { className:"health-ring-wrap" },
    React.createElement("div", { className:"health-ring" },
      React.createElement("svg", { viewBox:"0 0 88 88", width:88, height:88, "aria-hidden":"true" },

      ),
      React.createElement("div", { className:"health-ring-label" },
        React.createElement("span", { className:"health-ring-num", style:{color:color} }, score),
        React.createElement("span", { className:"health-ring-sub" }, "/100")

var _qrP = null;
function loadQRious() {
  if (typeof QRious !== "undefined") return Promise.resolve();
  if (_qrP) return _qrP;
  _qrP = new Promise(function(resolve, reject) {
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js";
    s.onload = function() { resolve(); };
    s.onerror = function() { reject(new Error("qrious")); };
    document.head.appendChild(s);
  });
  return _qrP;
}

function CourtQRCard(props) {
  var court = props.court, onClose = props.onClose;

  var canvasRef = useRef(null);
  var url = SITE + "/#court-" + court.id;

  useEffect(function() {
    loadQRious().then(function() {
      if (!canvasRef.current) return;
      new QRious({ element:canvasRef.current, value:url, size:220, backgroundAlpha:0, foreground:"#10B981", level:"H" });
    }).catch(function(){});
  }, []);

  var download = function() {
    if (!canvasRef.current) return;
    var offscreen = document.createElement("canvas");
    offscreen.width = 320; offscreen.height = 380;
    var ctx = offscreen.getContext("2d");
    ctx.fillStyle = "#0B0E18";
    if (ctx.roundRect) { ctx.roundRect(0,0,320,380,16); } else { ctx.fillRect(0,0,320,380); }
    ctx.fill();
    ctx.drawImage(canvasRef.current, 50, 40, 220, 220);
    ctx.fillStyle = "#10B981";
    ctx.font = "bold 14px 'Space Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText(court.name, 160, 290);
    ctx.fillStyle = "#6B7280";
    ctx.font = "11px 'Libre Franklin', sans-serif";
    ctx.fillText("fromgreytoplay.netlify.app", 160, 312);
    ctx.fillStyle = "#10B981";
    ctx.font = "11px 'Space Mono', monospace";
    ctx.fillText("Scan pentru detalii / Scan for details", 160, 340);
    var a = document.createElement("a");
    a.download = "qr-" + court.id + ".png";
    a.href = offscreen.toDataURL("image/png");
    a.click();
  };

  return React.createElement("div", {
    style:{position:"fixed",inset:0,zIndex:8000,background:"rgba(8,10,22,.8)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"},

      ),

function SatelliteTimeMachine(props) {
  var court = props.court;
  var app = useApp();
  var t = app.t;
  var mapEl = useRef(null);
  var nowLayerRef = useRef(null);
  var errRef = useRef(0);
  var opSt = useState(50);
  var op = opSt[0], setOp = opSt[1];
  var deadSt = useState(false);
  var dead = deadSt[0], setDead = deadSt[1];
  useEffect(function () {
    if (dead || !mapEl.current || typeof L === "undefined") return;
    var m = L.map(mapEl.current, { scrollWheelZoom: false }).setView([court.lat, court.lng], 17);
    var then = L.tileLayer("https://wayback.maptiles.arcgis.com/arcgis/rest/services/world_imagery/wmts/1.0.0/default028mm/mapserver/tile/10/{z}/{y}/{x}", {
      maxZoom: 18, attribution: "Esri World Imagery / Wayback"
    });
    var now = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18, opacity: op / 100
    });
    // If the Wayback service is unreachable, hide the whole card gracefully.
    var onErr = function () { errRef.current += 1; if (errRef.current >= 8) setDead(true); };
    then.on("tileerror", onErr);
    then.addTo(m);
    now.addTo(m);
    nowLayerRef.current = now;
    var tid = setTimeout(function () { m.invalidateSize(); }, 200);
    return function () {
      clearTimeout(tid);
      then.off("tileerror", onErr);
      nowLayerRef.current = null;
      m.remove();
    };
  }, [court.id, dead]);
  useEffect(function () {
    if (nowLayerRef.current) nowLayerRef.current.setOpacity(op / 100);
  }, [op]);
  if (dead) return null;

  );
}

/* === #2 Shoot-a-Hoop petition hook — 2D canvas, rigged bent rim.
   The rim always deflects; after 2 throws the overlay invites a signature. === */
function HoopGame(props) {
  var onDone = props.onDone;
  var app = useApp();
  var t = app.t;
  var tRef = useRef(t);
  tRef.current = t;
  var cvRef = useRef(null);
  var overSt = useState(false);
  var over = overSt[0], setOver = overSt[1];
  var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  useEffect(function () {
    var cv = cvRef.current;
    if (rm || !cv) return;
    var ctx = cv.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var H = 300, W = 320;
    function resize() {
      W = (cv.parentNode && cv.parentNode.clientWidth) || 320;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);
    var groundY = H - 36;
    var R = 13;
    var start = { x: 56, y: groundY - R };
    var ball = { x: start.x, y: start.y, vx: 0, vy: 0, rot: 0, flying: false };
    var drag = null, throws = 0, finished = false, bounces = 0, launchT = 0, clangT = 0;
    // Static cracks for the asphalt strip, generated once.
    var cracks = [];
    for (var ci = 0; ci < 7; ci++) {
      var seg = [], cxp = Math.random(), cyp = Math.random();
      for (var cj = 0; cj < 4; cj++) { seg.push([cxp, cyp]); cxp += (Math.random() - 0.5) * 0.12; cyp += (Math.random() - 0.5) * 0.9; }
      cracks.push(seg);
    }
    function rimGeo() {
      var poleX = W - 44;
      var a = 25 * Math.PI / 180; // the bend
      var x0 = poleX - 10, y0 = 118;
      return { poleX: poleX, x0: x0, y0: y0, x1: x0 - 46 * Math.cos(a), y1: y0 + 46 * Math.sin(a) };
    }
    function deflect() {
      ball.vx = -Math.abs(ball.vx) * 0.45 - 90 - Math.random() * 60;
      ball.vy = -Math.abs(ball.vy) * 0.3 - 70;
      clangT = performance.now();
    }
    function endThrow() {
      throws += 1;
      ball.flying = false;
      bounces = 0;
      ball.x = start.x; ball.y = start.y; ball.vx = 0; ball.vy = 0; ball.rot = 0;
      if (throws >= 2) {
        finished = true;
        setOver(true);
      }
    }
    function step(dt) {
      if (!ball.flying) return;
      ball.vy += 1700 * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.rot += ball.vx * dt * 0.02;
      var g = rimGeo();
      // Backboard / pole: bounce back.
      if (ball.x + R > g.poleX - 12 && ball.y > 58 && ball.y < 150 && ball.vx > 0) {
        ball.x = g.poleX - 12 - R;
        ball.vx = -Math.abs(ball.vx) * 0.5;
        clangT = performance.now();
      }
      // Rigged rim: distance to the bent rim segment — always knocks the ball out.
      var dx = g.x1 - g.x0, dy = g.y1 - g.y0;
      var tt = Math.max(0, Math.min(1, ((ball.x - g.x0) * dx + (ball.y - g.y0) * dy) / (dx * dx + dy * dy)));
      var px = g.x0 + dx * tt, py = g.y0 + dy * tt;
      if (Math.hypot(ball.x - px, ball.y - py) < R + 4) deflect();
      // Guard zone above the basket mouth: no clean swish is possible.
      var mx = (g.x0 + g.x1) / 2, my = (g.y0 + g.y1) / 2;
      if (ball.vy > 0 && Math.hypot(ball.x - mx, ball.y - my) < 30) deflect();
      // Ground bounce.
      if (ball.y + R > groundY) {
        ball.y = groundY - R;
        ball.vy = -ball.vy * 0.45;
        ball.vx *= 0.75;
        bounces += 1;
        if (Math.abs(ball.vy) < 60 && bounces >= 2) { endThrow(); return; }
      }
      if (ball.x < -60 || ball.x > W + 60 || performance.now() - launchT > 6000) endThrow();
    }
    function draw() {
      var g = rimGeo();
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#2e333c"); bg.addColorStop(1, "#21252c");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // asphalt
      ctx.fillStyle = "#3a3e46"; ctx.fillRect(0, groundY, W, H - groundY);
      ctx.strokeStyle = "rgba(12,12,16,.7)"; ctx.lineWidth = 1.4;
      cracks.forEach(function (seg) {
        ctx.beginPath();
        seg.forEach(function (p, i) {
          var x = p[0] * W, y = groundY + 4 + Math.abs(p[1] % 1) * (H - groundY - 8);
          if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        });
        ctx.stroke();
      });
      // pole + board + bent rim (no net)
      ctx.fillStyle = "#565b64"; ctx.fillRect(g.poleX, 64, 7, groundY - 64);
      ctx.fillStyle = "#8a909a"; ctx.fillRect(g.poleX - 12, 64, 8, 78);
      var fresh = performance.now() - clangT < 120;
      ctx.strokeStyle = fresh ? "#ffffff" : "#F97316";
      ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(g.x0, g.y0); ctx.lineTo(g.x1, g.y1); ctx.stroke();
      // hint + throws left
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.font = "12px 'Space Mono',monospace";
      ctx.textAlign = "center";
      ctx.fillText(tRef.current.hoopHint, W / 2, 26);
      ctx.textAlign = "left";
      for (var i = 0; i < 2 - throws; i++) {
        ctx.fillStyle = "#F97316";
        ctx.beginPath(); ctx.arc(16 + i * 18, 18, 5, 0, Math.PI * 2); ctx.fill();
      }
      // aim line
      if (drag) {
        var ax = start.x + (start.x - drag.x), ay = start.y + (start.y - drag.y);
        ctx.strokeStyle = "rgba(255,255,255,.45)";
        ctx.setLineDash([5, 6]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.setLineDash([]);
      }
      // ball
      ctx.save();
      ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
      ctx.fillStyle = "#F97316";
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(120,50,8,.8)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -R * 1.4, R * 1.05, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
      ctx.restore();
    }
    var raf, last = performance.now();
    function loop(now) {
      if (finished) { draw(); return; }
      var dt = Math.min((now - last) / 1000, 0.032);
      last = now;
      step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    function pos(e) {
      var r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function down(e) {
      if (finished || ball.flying) return;
      var p = pos(e);
      if (Math.hypot(p.x - ball.x, p.y - ball.y) < 52) {
        drag = p;
        if (cv.setPointerCapture && e.pointerId != null) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
        e.preventDefault();
      }
    }
    function move(e) {
      if (!drag) return;
      var p = pos(e);
      var ddx = p.x - start.x, ddy = p.y - start.y;
      var d = Math.hypot(ddx, ddy);
      if (d > 90) { ddx *= 90 / d; ddy *= 90 / d; }
      drag = { x: start.x + ddx, y: start.y + ddy };
      ball.x = drag.x; ball.y = drag.y;
      e.preventDefault();
    }
    function up() {
      if (!drag) return;
      var vx = (start.x - drag.x) * 11, vy = (start.y - drag.y) * 11;
      drag = null;
      if (Math.hypot(vx, vy) < 80) { ball.x = start.x; ball.y = start.y; return; }
      ball.vx = vx; ball.vy = vy;
      ball.flying = true;
      bounces = 0;
      launchT = performance.now();
    }
    cv.addEventListener("pointerdown", down);
    cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    return function () {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      cv.removeEventListener("pointerdown", down);
      cv.removeEventListener("pointermove", move);
      cv.removeEventListener("pointerup", up);
      cv.removeEventListener("pointercancel", up);
    };
  }, [rm]);
  if (rm) return null;
  return React.createElement("div", { className: "card mb-2", style: { padding: 0, borderLeft: "3px solid var(--coral)", maxWidth: 600, margin: "0 auto 1.2rem" } },
    React.createElement("div", { className: "hoop-wrap" },
      React.createElement("canvas", { ref: cvRef, className: "hoop-canvas", height: 300 }),
      !over && React.createElement("button", { className: "hoop-skip", onClick: onDone }, t.hoopSkip + " →"),

        React.createElement("button", { className: "btn btn-green", onClick: onDone }, "✊ " + t.hoopSign)
      )
    )
  );
}

/* === #3 Civic graffiti pixel wall — shared 48×48 canvas in pixels/{x_y} === */
var PX_GRID = 48;
var PX_COLORS = ["#10B981", "#0D9488", "#F97316", "#DC2626", "#F59E0B", "#8B5CF6", "#3B82F6", "#EC4899", "#FFFFFF", "#1A1A2E"];
var PX_COOLDOWN_MS = 10 * 60 * 1000;
function PixelWall() {
  var app = useApp();
  var t = app.t, toast = app.toast, user = app.user, theme = app.theme;
  var data = useFirebase("pixels");
  var cvRef = useRef(null);
  var colSt = useState(PX_COLORS[0]);
  var col = colSt[0], setCol = colSt[1];
  var leftSt = useState(function () {
    return Math.max(0, (+(localStorage.getItem("g2p_px_ts") || 0)) + PX_COOLDOWN_MS - Date.now());
  });
  var left = leftSt[0], setLeft = leftSt[1];
  useEffect(function () {
    var iv = setInterval(function () {
      setLeft(Math.max(0, (+(localStorage.getItem("g2p_px_ts") || 0)) + PX_COOLDOWN_MS - Date.now()));
    }, 1000);
    return function () { clearInterval(iv); };
  }, []);
  useEffect(function () {
    var cv = cvRef.current;
    if (!cv) return;
    var ctx = cv.getContext("2d");
    var cell = 480 / PX_GRID;
    var checker = theme === "dark" ? ["#1E2235", "#181C2E"] : ["#E9ECF1", "#F3F5F9"];
    for (var y = 0; y < PX_GRID; y++) {
      for (var x = 0; x < PX_GRID; x++) {
        ctx.fillStyle = checker[(x + y) % 2];
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    if (data) Object.keys(data).forEach(function (k) {
      var p = k.split("_");
      var px = +p[0], py = +p[1];
      if (isNaN(px) || isNaN(py) || px < 0 || py < 0 || px >= PX_GRID || py >= PX_GRID) return;
      if (typeof data[k] !== "string") return;
      ctx.fillStyle = data[k];
      ctx.fillRect(px * cell, py * cell, cell, cell);
    });
  }, [data, theme]);
  var place = function (e) {
    var cv = cvRef.current;
    if (!cv || left > 0) return;
    var r = cv.getBoundingClientRect();
    var x = Math.floor((e.clientX - r.left) / r.width * PX_GRID);
    var y = Math.floor((e.clientY - r.top) / r.height * PX_GRID);
    if (x < 0 || y < 0 || x >= PX_GRID || y >= PX_GRID) return;
    db.ref("pixels/" + x + "_" + y).set(col);
    localStorage.setItem("g2p_px_ts", String(Date.now()));
    setLeft(PX_COOLDOWN_MS);
    toast(t.pixelPlaced);
    logActivity("pixel", (user && user.name) || "Anonim");
  };
  var exportPng = function () {
    var cv = cvRef.current;
    if (!cv) return;
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "g2p-mural.png";
    a.click();
  };
  var count = data ? Object.keys(data).length : 0;
  var mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
  var fmt = mm + ":" + String(ss).padStart(2, "0");
  return React.createElement("div", null,
    React.createElement("div", { className: "flex justify-between items-center mb-1", style: { flexWrap: "wrap", gap: ".5rem" } },
      React.createElement("h3", { style: { fontSize: "1rem" } }, "🎨 ", t.pixelTitle),
      React.createElement("span", { className: "badge badge-green" }, count + "/" + (PX_GRID * PX_GRID) + " " + t.pixelPainted)
    ),
    React.createElement("p", { className: "text-sm mb-2", style: { color: "var(--textSec)" } }, t.pixelSub),
    React.createElement("div", { className: "card" },
      React.createElement("canvas", { ref: cvRef, className: "px-canvas", width: 480, height: 480, onClick: place }),
      left > 0
        ? React.createElement("div", { style: { textAlign: "center", margin: ".8rem 0" } },
            React.createElement("span", { className: "px-cool" }, "⏳ " + t.pixelWait + " " + fmt))
        : React.createElement("div", { className: "px-palette" },
            PX_COLORS.map(function (c) {
              return React.createElement("button", {
                key: c,
                className: "px-swatch" + (col === c ? " on" : ""),
                style: { background: c },
                onClick: function () { setCol(c); },
                "aria-label": c,
                "aria-pressed": col === c
              });
            })),
      React.createElement("div", { style: { textAlign: "center" } },
        React.createElement("button", { className: "btn btn-outline btn-sm", onClick: exportPng }, "⬇️ PNG"))
    )
  );
}

/* Haversine great-circle distance in km between two lat/lng pairs. */
function haversineKm(lat1, lng1, lat2, lng2) {
  var toRad = function (d) { return d * Math.PI / 180; };
  var R = 6371;
  var dLat = toRad(lat2 - lat1);
  var dLng = toRad(lng2 - lng1);
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* Relative time label ("acum 2h" / "2h ago" / "2 órája"). */
function relTime(ts, lang) {
  var diff = Math.max(0, Date.now() - (Number(ts) || 0));
  var mins = Math.floor(diff / 60000);
  var hrs = Math.floor(diff / 3600000);
  var days = Math.floor(diff / 86400000);
  if (lang === "ro") {
    if (mins < 1) return "chiar acum";
    if (mins < 60) return "acum " + mins + " min";
    if (hrs < 24) return "acum " + hrs + "h";
    return "acum " + days + (days === 1 ? " zi" : " zile");
  }
  if (lang === "hu") { // TODO: HU review
    if (mins < 1) return "épp most";
    if (mins < 60) return mins + " perce";
    if (hrs < 24) return hrs + " órája";
    return days + " napja";
  }
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  if (hrs < 24) return hrs + "h ago";
  return days + (days === 1 ? " day ago" : " days ago");
}

/* Civic streak: bumped on every civic action via logActivity().
   localStorage g2p_streak = {count, last:"YYYY-MM-DD"}. */
function streakDateStr(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function bumpStreak() {
  try {
    var today = streakDateStr();
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yesterday = streakDateStr(y);
    var raw = localStorage.getItem("g2p_streak");
    var st = raw ? JSON.parse(raw) : null;
    var count;
    if (st && st.last === today) { count = st.count; }
    else if (st && st.last === yesterday) { count = (st.count || 0) + 1; }
    else { count = 1; }
    localStorage.setItem("g2p_streak", JSON.stringify({ count: count, last: today }));
    return count;
  } catch (e) { return 0; }
}
function readStreak() {
  try {
    var raw = localStorage.getItem("g2p_streak");
    if (!raw) return { count: 0, last: null };
    var st = JSON.parse(raw);
    var today = streakDateStr();
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yesterday = streakDateStr(y);
    // Streak only "alive" if last action was today or yesterday.
    if (st.last === today || st.last === yesterday) return st;
    return { count: 0, last: st.last };
  } catch (e) { return { count: 0, last: null }; }
}

  ro: "Cauta Targu Mures pe Google si fotografiile iti vand un vis – trasee de alergare pe Platoul Cornesti, parcuri verzi, fatade colorate. Oras sportiv, zic ei. Dar ia autobuzul spre Tudor sau in spatele Auchan, si visul se crapa, la propriu. Terenurile sunt sparte, cosurile indoite, si nimanui pare sa-i pese. Am vrut sa aflu de ce.\n\nAm cautat mai intai dovezi academice. Un studiu din 2023 in Urban Science (publicat de MDPI) compara modul in care orasele europene gestioneaza infrastructura recreationala si argumenteaza ca distributia inegala tinde sa adanceasca decalajele sociale. Este un studiu amplu, transnational – nu se potriveste perfect pentru un singur oras romanesc – dar rationamentul mi-a ramas. Journal of Urban Health restrange focusul: absenta terenurilor sportive la nivel de cartier se coreleaza direct cu inactivitatea si izolarea tinerilor. Ceea ce a fost decisiv a fost descoperirea Strategiei Integrate de Dezvoltare Urbana (SIDU), publicata pe site-ul Primariei. Documentul admite deschis ca districtele periferice – cele cu populatiile cele mai tinere – primesc cele mai putine investitii in infrastructura.\n\nReportajele locale au adaugat culoare. O investigatie Punctul.ro din octombrie 2025 a expus cum o eroare administrativa de cinci milioane de lei a inghetat renovarea unei baze sportive de pe strada Insulei – birocratie la superlativ. Un alt reportaj Punctul.ro a explorat cum Cluj si Sibiu au transformat cu succes loturi urbane neglijate in hub-uri digitale, evidentiind prin contrast cat de putin a facut Targu Mures. Acum, presa poate sensationaliza, asa ca am verificat cu bugetul oficial al Primariei Targu Mures. Cifrele s-au aliniat: fondurile promise pentru renovari depasesc constant ceea ce se cheltuieste efectiv.\n\nTotusi, cercetarea de birou iti arata doar o parte din imagine. Pe parcursul a doua weekenduri, am strabatut Tudor, zona Auchan si terenurile de langa Sportcomplex, fotografiind asfalt crapat si cosuri indoite si le-am inregistrat pe Google My Maps. Am facut si un sondaj informal rapid – cincisprezece rezidenti, o intrebare: folosesti terenul cel mai aproape de tine? Doisprezece au spus nu, prea degradat. Trei au spus ocazional, din lipsa de alternative. Cincisprezece respondenti nu vor castiga un premiu de statistica, dar acel nivel de consens este greu de respins.\n\nPunand piesele cap la cap, apare un lant clar: pasul unu, municipalitatea concentreaza cheltuielile pe locatii centrale de profil inalt; pasul doi, terenurile periferice se degradeaza din pura neatentie; pasul trei, tinerii din acele zone isi pierd sansa la sport regulat si la viata sociala care vine cu el. Platoul Cornesti ar putea fi intr-un alt cod postal fata de periferie. Nu spun ca cineva actioneaza din rautate – bugetele limitate si prea multe cereri concurente probabil explica mult. Dar rezidentii din aceste cartiere nu au canale civice clare pentru a semnala problema, si aceasta tacere lasa ciclul sa se repete.\n\nPrima mea propunere este un pilot Flip-the-Court: alegem trei dintre cele mai degradate terenuri, le refacem suprafata si echipam fiecare cu un dulap de echipament rezistent la intemperii pe care localnicii il pot debloca printr-o aplicatie gratuita. Aplicatia functioneaza si ca instrument de feedback – oamenii evalueaza facilitatile, raporteaza daunele si sugereaza ce echipament sportiv sa fie aprovizionat. Ca finantare, micro-granturile EU pentru sport-tineret acopera costurile principale; cateva parteneriate cu sali de sport locale acopera intretinerea. De la obtinerea grantului pana la taierea panglicii, sase luni par realizabile.\n\nA doua idee se bazeaza mai mult pe arta decat pe tehnologie. O initiativa Street Canvas ar aduce artistii locali de graffiti si rezidentii impreuna pentru a picta murale colorate la scara mare pe suprafetele renovate – finantata aproape in intregime din spray paint donat si ore de voluntariat. De ce sa ne obosim? Cercetarile privind atasamentul de loc arata ca oamenii care   en: "Google Târgu Mureș and the photos sell you a dream – running trails on the Cornești Plateau, green parks, colourful facades. Sporty city, they say. But ride the bus out to Tudor or behind Auchan, and the dream cracks, quite literally. The courts are broken, the hoops bent, and nobody seems to care. I wanted to find out why.\n\nI went looking for academic backing first. A 2023 study in Urban Science (published by MDPI) compares how European cities manage recreational infrastructure and argues that uneven distribution tends to widen social gaps rather than narrow them. It is a broad, cross-national piece – not a perfect fit for one Romanian city – but the reasoning stuck with me. The Journal of Urban Health narrows the focus: the absence of neighbourhood-level sports courts correlates directly with youth inactivity and isolation. What really sealed it, though, was finding our city’s Integrated Urban Development Strategy (SIDU), published on the Primaria website. The document openly admits that peripheral districts – the ones with the youngest populations – receive the least infrastructure investment.\n\nLocal reporting added colour. A Punctul.ro investigation from October 2025 exposed how a five-million-lei administrative mix-up froze the renovation of a sports facility on Insulei Street – bureaucracy at its finest. A separate Punctul.ro feature explored how Cluj and Sibiu successfully repurposed neglected urban lots into digital hubs, highlighting by contrast just how little Targu Mures has done. Now, media outlets can sensationalise, so I cross-checked against the official Primaria Targu Mures budget. The numbers lined up: pledged renovation funds consistently outstrip what actually gets spent on the ground.\n\nStill, desk research only shows you part of the picture. Over two weekends, I walked through Tudor, the Auchan area, and the courts near Sportcomplex, photographing cracked asphalt and bent rims and logging it all on Google My Maps. I also ran a quick, ll or handball. It is about whether your address should cap your opportunities. A small pilot, a few murals, some stubborn community effort – the price tag is modest. The only expensive thing is continuing to do nothing."

      const green = [16, 185, 129], coral = [249, 115, 22], dark = [26, 26, 46];

      const sCount = signups ? Object.keys(signups).length : 0;
      const vCount = signups ? Object.values(signups).filter(s => s.volunteer).length : 0;
      const repList = reports ? Object.values(reports) : [];

      const photos = gallery ? Object.values(gallery) : [];
      // ---- Cover page ----
      doc.setFillColor(...dark); doc.rect(0, 0, W, H, "F");
      doc.setFillColor(...green); doc.rect(0, 110, W, 3, "F");
      doc.setTextColor(255, 255, 255);

      doc.text("FROM GREY TO PLAY", M, 30);

      doc.setFontSize(9); doc.setTextColor(150, 150, 160);
      doc.text(new Date().toLocaleDateString("ro-RO") + " · " + SITE.replace("https://", ""), M, H - 20);
      // ---- Stats page ----
      doc.addPage();
      let y = 24;
      const heading = (txt) => { doc.setFillColor(...green); doc.rect(M, y - 5, 3, 7, "F"); doc.setTextColor(...dark); doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.text(txt, M + 6, y); y += 11; };
      heading(lang === "ro" ? "Sumar executiv" : lang === "hu" ? "Vezetői összefoglaló" : "Executive summary");
      const stats = [
        [String(COURTS.length), t.courtsReported],
        [String(tv), t.petitionVotes],
        [String(sCount), lang === "ro" ? "Semnături" : "Signatures"],
        [String(vCount), t.volunteers],
        [String(repList.length), lang === "ro" ? "Sesizări" : "Reports"],
        [String(resolved), t.statusResolved || "Resolved"]
      ];
      const cardW = (maxW - 10) / 3;
      stats.forEach((s, i) => {
        const col = i % 3, row = Math.floor(i / 3);
        const x = M + col * (cardW + 5), cy = y + row * 26;
        doc.setFillColor(245, 247, 250); doc.roundedRect(x, cy, cardW, 22, 2, 2, "F");
        doc.setTextColor(...green); doc.setFont("helvetica", "bold"); doc.setFontSize(18);
        doc.text(s[0], x + 4, cy + 10);
        doc.setTextColor(90, 90, 100); doc.setFont("helvetica", "normal"); doc.setFontSize(8);
        doc.splitTextToSize(s[1], cardW - 6).forEach((l, j) => doc.text(l, x + 4, cy + 16 + j * 4));
      });
      y += 26 * Math.ceil(stats.length / 3) + 8;
      // ---- Courts list ----
      heading(lang === "ro" ? "Terenuri documentate" : lang === "hu" ? "Dokumentált pályák" : "Documented courts");
      doc.setFontSize(9.5);
      COURTS.forEach(c => {
        if (y > 275) { doc.addPage(); y = 24; }
        const sc = c.status === "degraded" ? coral : green;
        doc.setFillColor(...sc); doc.circle(M + 1.5, y - 1.5, 1.5, "F");
        doc.setTextColor(40, 40, 50); doc.setFont("helvetica", "bold");
        doc.text(c.name, M + 6, y);
        doc.setFont("helvetica", "normal"); doc.setTextColor(120, 120, 130); doc.setFontSize(8);
        const sLabel = c.status === "degraded" ? t.degraded : c.status === "inProgress" ? t.inProgress : t.renovated;
        doc.text(sLabel + " · " + (c.address || ""), M + 6, y + 4);
        doc.setFontSize(9.5);
        y += 9;
      });
      y += 4;
      // ---- Reports summary ----
      if (repList.length) {
        if (y > 250) { doc.addPage(); y = 24; }
        heading(lang === "ro" ? "Sesizări recente" : lang === "hu" ? "Friss bejelentések" : "Recent reports");
        doc.setFontSize(9);

          if (y > 278) { doc.addPage(); y = 24; }
          doc.setTextColor(60, 60, 70); doc.setFont("helvetica", "bold");
          doc.text("• " + (r.courtName || r.courtId || "?"), M, y);
          doc.setFont("helvetica", "normal"); doc.setTextColor(120, 120, 130);
          const desc = doc.splitTextToSize((r.description || "").slice(0, 120), maxW - 4);
          doc.text(desc[0] || "", M + 4, y + 4);
          y += 9;
        });
        y += 4;
      }
      // ---- Evidence photos ----
      const evidencePhotos = photos.filter(p => p.img).slice(0, 6);
      if (evidencePhotos.length) {
        doc.addPage(); y = 24;
        heading(lang === "ro" ? "Dovezi fotografice" : lang === "hu" ? "Fotóbizonyítékok" : "Photo evidence");
        const pw = (maxW - 6) / 2, ph = 40;
        for (let i = 0; i < evidencePhotos.length; i++) {
          const col = i % 2, row = Math.floor(i / 2);
          const x = M + col * (pw + 6), cy = y + row * (ph + 12);
          if (cy + ph > 280) break;
          try {
            const fmt = evidencePhotos[i].img.includes("png") ? "PNG" : "JPEG";
            doc.addImage(evidencePhotos[i].img, fmt, x, cy, pw, ph, undefined, "FAST");
          } catch (e) { /* skip bad image */ }

        }
      }
      // ---- Footer on all pages ----
      const pages = doc.getNumberOfPages();
      for (let p = 1; p <= pages; p++) {

        doc.setDrawColor(225, 225, 230); doc.line(M, H - 12, W - M, H - 12);
        doc.setFontSize(7); doc.setTextColor(150, 150, 160);
        doc.text("From Grey to Play · " + SITE.replace("https://", ""), M, H - 8);
        doc.text(p + " / " + pages, W - M, H - 8, { align: "right" });

    React.createElement("div", { className: "flex justify-between items-center", style: { gap: "1rem", flexWrap: "wrap" } },
      React.createElement("div", { style: { flex: 1, minWidth: 180 } },
        React.createElement("h3", { className: "barlow", style: { fontSize: "1.15rem", marginBottom: ".25rem" } }, "📋 ", t.dossier),
        React.createElement("p", { className: "text-sm", style: { color: "var(--textSec)" } }, t.dossierSub)
