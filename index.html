<script>
/* Apple fluid pack: drag-to-dismiss for phone sheets (.modal inside .modal-overlay, <=600px).
   1:1 tracking from the grab point, 10 px hysteresis + direction lock, rubber-band above the top,
   release velocity -> Apple momentum projection decides dismiss vs. spring back.
   Dismiss = the overlay's own React onClick (the same close path as tapping the backdrop). */
(function () {
  try {
    var mq = window.matchMedia("(max-width:600px)"), rm = window.matchMedia("(prefers-reduced-motion:reduce)");
    var st = null;

      var p = k && ov[k];

    }
    // Any scroller between the finger and the overlay (inclusive) that is not at its top.
    function scrolledAncestor(el, modal) {
      var stop = modal.parentNode && modal.parentNode.parentNode;
      for (var n = el; n && n !== stop; n = n.parentNode) if (n.scrollTop > 0) return true;
      return false;
    }
    document.addEventListener("touchstart", function (e) {
      st = null;
      if (!mq.matches || e.touches.length !== 1) return;
      var t = e.target, modal = t.closest && t.closest(".modal"), ov = modal && modal.parentNode;
      if (!modal || !ov || !ov.classList || !ov.classList.contains("modal-overlay")) return;
      if (t.closest("input,textarea,select,canvas,[contenteditable],.leaflet-container,[data-no-drag]")) return;
      if (scrolledAncestor(t, modal)) return;
      var y = e.touches[0].clientY;
      st = { modal: modal, ov: ov, y0: y, x0: e.touches[0].clientX, h: modal.offsetHeight, lock: 0, dy: 0, hist: [[y, e.timeStamp]] };
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (!st) return;
      var y = e.touches[0].clientY, x = e.touches[0].clientX, dy = y - st.y0;
      if (!st.lock) {
        if (Math.abs(dy) < 10 && Math.abs(x - st.x0) < 10) return;
        var m = st.modal;
        // Only a downward pull from the very top drags the sheet. An upward swipe is always a
        // native scroll (inner scrollers, the overlay itself); hijacking it made sheets bounce.
        if (dy < 0 || Math.abs(x - st.x0) > Math.abs(dy) || scrolledAncestor(e.target, m)) { st = null; return; }
        st.lock = 1; m.classList.add("sheet-drag");   // keep y0: the sheet stays glued to the grab point
      }

      st.hist.push([y, e.timeStamp]); if (st.hist.length > 6) st.hist.shift();

      st.ov.style.backgroundColor = "rgba(0,0,0," + (0.6 * Math.max(0, 1 - Math.max(0, dy) / st.h)).toFixed(3) + ")";
    }, { passive: false });
    function end() {
      if (!st || !st.lock) { st = null; return; }
      var s = st; st = null;
      var a = s.hist[0], b = s.hist[s.hist.length - 1], dt = Math.max(1, b[1] - a[1]);
      var v = (b[0] - a[0]) / dt;                          // px/ms, + = downward
      var projected = s.dy + v * 0.998 / (1 - 0.998);      // Apple project(): (v/1000)*d/(1-d) with v in px/s
      var close = s.dy > 0 && (projected > s.h * 0.5 || v > 0.5) && closer(s.ov);
      s.modal.classList.remove("sheet-drag");
      if (close) {
        var rest = Math.max(0, s.h - s.dy), ms = Math.max(160, Math.min(380, v > 0 ? rest / v : 380));
        s.modal.style.transition = "transform " + ms + "ms cubic-bezier(.32,.72,0,1)";
        s.ov.style.transition = "background-color " + ms + "ms ease";
        s.modal.style.transform = "translateY(" + (s.h + 24) + "px)";
        s.ov.style.backgroundColor = "rgba(0,0,0,0)";
        try { navigator.vibrate && navigator.vibrate(8); } catch (err) {}
        var done = false, fire = function () { if (done) return; done = true; try { close({ target: s.ov, currentTarget: s.ov, stopPropagation: function () {}, preventDefault: function () {} }); } catch (err) {} };
        s.modal.addEventListener("transitionend", fire, { once: true });
        setTimeout(fire, ms + 80);
      } else {
        s.modal.style.transition = rm.matches ? "transform .2s ease" : "transform .6s var(--spring, cubic-bezier(.23,1,.32,1))";
        s.ov.style.transition = "background-color .3s ease";
        s.modal.style.transform = "";
        s.ov.style.backgroundColor = "";
        setTimeout(function () { s.modal.style.transition = ""; s.ov.style.transition = ""; }, 650);
      }
    }
    document.addEventListener("touchend", end, { passive: true });
    document.addEventListener("touchcancel", end, { passive: true });
  } catch (e) {}
})();

/* iOS premium pack: navbar scroll-edge state + one gliding pill/ink per nav/tab group.
   Pure decoration on top of the existing .active classes: if anything here fails, the old styling stays. */
(function () {
  try {
    var raf = 0;
    function navEdge() { var n = document.querySelector(".navbar"); if (n) n.classList.toggle("nav-scrolled", window.scrollY > 4); }
    window.addEventListener("scroll", navEdge, { passive: true });
    function glide(box, sel, cls) {
      var act = box.querySelector(sel), g = box.querySelector(":scope>." + cls);
      if (!act) { if (g && g.classList.contains("on")) { g.classList.remove("on"); g._k = ""; } return; }
      if (!g) { g = document.createElement("span"); g.className = cls + " snap"; g.setAttribute("aria-hidden", "true"); box.appendChild(g); box.classList.add("has-glide"); }
      var x = act.offsetLeft, y = cls === "glide-ink" ? act.offsetTop + act.offsetHeight - 2 : act.offsetTop, w = act.offsetWidth, h = cls === "glide-ink" ? 2 : act.offsetHeight;
      var key = x + "," + y + "," + w + "," + h;
      if (g._k === key) return;
      var first = !g._k; g._k = key;
      g.style.width = w + "px"; if (cls !== "glide-ink") g.style.height = h + "px";
      g.style.transform = "translate(" + x + "px," + y + "px)";
      g.classList.add("on");
      if (first) requestAnimationFrame(function () { requestAnimationFrame(function () { g.classList.remove("snap"); }); });
    }
    function all() {
      raf = 0; navEdge();
      document.querySelectorAll(".nav-links.desktop").forEach(function (b) { if (b.offsetParent) glide(b, ":scope>a.active", "glide-pill"); });
      document.querySelectorAll(".tabs").forEach(function (b) { if (b.offsetParent) glide(b, ":scope>button.active", "glide-ink"); });
    }
    function soon() { if (!raf) raf = requestAnimationFrame(all); }
    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) { var t = ms[i].target; if (ms[i].type === "childList" || (t.parentNode && t.parentNode.classList && (t.parentNode.classList.contains("tabs") || t.parentNode.classList.contains("nav-links")))) { soon(); return; } }

    soon();
  } catch (e) {}
